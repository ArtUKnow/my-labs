db:
  path: data/crawler.db

logic:
  delay: 1.0
  max_pages: 30
  timeout: 30
  recrawl_after: 86400
  retry_delay: 60

source_ru_wikipedia:
  prefix: https://ru.wikipedia.org/wiki/
  seeds:
    - https://ru.wikipedia.org/wiki/Космонавтика
    - https://ru.wikipedia.org/wiki/Категория:Космонавтика
  skip:
    - "Файл:"
    - "Категория:"
    - "Википедия:"
    - "Служебная:"
    - "Шаблон:"
    - "Обсуждение:"
    - "Портал:"
    - "Справка:"

source_simple_wikipedia:
  prefix: https://simple.wikipedia.org/wiki/
  seeds:
    - https://simple.wikipedia.org/wiki/Spaceflight
  skip:
    - "File:"
    - "Category:"
    - "Wikipedia:"
    - "Special:"
    - "Template:"
    - "Talk:"
    - "Help:"
    - "Portal:"
